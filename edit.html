<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Task</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="container">
    <header>
      <h1>✏️ Edit Task</h1>
    </header>

    <section class="card">
      <form action="{{ url_for('edit_task', task_id=task['id']) }}" method="POST" class="task-form">
        <input type="text" name="title" value="{{ task['title'] }}" required>
        <textarea name="description">{{ task['description'] or '' }}</textarea>

        <div class="form-row">
          <input type="text" name="category" value="{{ task['category'] }}">
          <select name="priority">
            <option value="Low" {{ 'selected' if task['priority'] == 'Low' else '' }}>Low Priority</option>
            <option value="Medium" {{ 'selected' if task['priority'] == 'Medium' else '' }}>Medium Priority</option>
            <option value="High" {{ 'selected' if task['priority'] == 'High' else '' }}>High Priority</option>
          </select>
          <input type="date" name="due_date" value="{{ task['due_date'] or '' }}">
        </div>

        <div class="form-row">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </section>
  </div>

</body>
</html>
